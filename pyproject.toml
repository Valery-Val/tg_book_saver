[project]
name = "tg-saver"
version = "0.1.0"
description = "ETL pipeline for extracting audiobooks from Telegram"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.51",
    "loguru>=0.7.3",
    "telethon>=1.36",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "prefect>=2.14",
    "duckdb>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "ipykernel>=6.0",
]